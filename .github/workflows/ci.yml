name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Detect Go sources
        id: has-go
        run: |
          if [[ -n "$(git ls-files '*.go')" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Go-файлов пока нет — lint/build/test пропускаются."
          fi

      # parse-pdf (P1.4) собран на gosseract — это cgo-биндинг к libtesseract,
      # поэтому без dev-пакетов не грузится даже пакет internal/parser при
      # typecheck у golangci-lint; тесты PDF дополнительно требуют poppler и
      # русский языковой пакет Tesseract.
      - name: Install PDF toolchain (poppler, Tesseract)
        if: steps.has-go.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus \
            libtesseract-dev libleptonica-dev

      - name: golangci-lint
        if: steps.has-go.outputs.found == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5

      - name: Build
        if: steps.has-go.outputs.found == 'true'
        run: go build ./...

      - name: Test
        if: steps.has-go.outputs.found == 'true'
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
