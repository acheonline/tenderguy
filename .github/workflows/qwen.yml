name: Qwen Code Action

on:
  issue_comment:
    types: [created]

jobs:
  qwen:
    if: contains(github.event.comment.body, '@qwencoder')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qwen Code
        run: npm install -g @qwen-code/qwen-code

      - name: Run Qwen Code
        env:
          MY_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          echo "Проверка: длина ключа = ${#MY_API_KEY} символов"
          
          # Извлекаем текст комментария, отрезая упоминание бота
          PROMPT=$(echo "${{ github.event.comment.body }}" | sed 's/@qwencoder//g')
          
          # Запускаем Qwen с правильными флагами из справки CLI
          qwen --yolo \
            --prompt "$PROMPT" \
            --output-format text \
            --openai-api-key "$MY_API_KEY" \
            --openai-base-url "https://token-plan.maas.qwencloudapi.com/compatible-mode/v1" \
            --model auto