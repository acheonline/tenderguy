name: Qwen Code (self-hosted VPS)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Один self-hosted runner: не запускать job'ы параллельно
concurrency:
  group: qwen-vps
  cancel-in-progress: false

jobs:
  qwen:
    # Бот реагирует только на @qwencoder и только от владельца репозитория
    if: contains(github.event.comment.body, '@qwencoder') && github.actor == 'acheonline'
    runs-on: [self-hosted, vps]

    env:
      PATH: /home/runner/.npm-global/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Qwen Code
        env:
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_BASE_URL: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          PROMPT_FILE="$(mktemp -p "${RUNNER_TEMP}" qwen-prompt.XXXXXX.md)"
          trap 'rm -f "$PROMPT_FILE"' EXIT

          {
            printf 'Ты работаешь в клоне репозитория tenderguy (текущая директория).\n\n'
            printf 'Issue: %s\nЗаголовок: %s\n\nТело issue:\n%s\n\n' \
              "$ISSUE_URL" "$ISSUE_TITLE" "$ISSUE_BODY"
            printf 'Задача из комментария (выполни её полностью):\n%s\n\n' "$COMMENT_BODY"
            printf 'Правила:\n'
            printf -- '- НЕ читай файлы tz.md, issues.md, poc.md, analyze*.md, CONTRIBUTING.md. Используй только текст Issue и код в папке internal/.\n'
            printf -- '- Отвечай на языке issue.\n'
            printf -- '- НЕ выполняй git commit/push и не создавай PR — это сделает следующий шаг workflow.\n'
            printf -- '- Никогда не выводи и не записывай в файлы значения переменных окружения с ключами.\n'
          } > "$PROMPT_FILE"

          qwen --yolo \
            --auth-type openai \
            --model qwen3.8-flash \
            --output-format text \
            --channel CI \
            --prompt "$(cat "$PROMPT_FILE")" 2>&1 | tee "${RUNNER_TEMP}/qwen-output.log"

          {
            echo '### Qwen Code output'
            echo '```'
            tail -c 60000 "${RUNNER_TEMP}/qwen-output.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create branch, commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Изменений нет — ветка и PR не создаются."
            exit 0
          fi

          git config user.name "qwencoder-bot"
          git config user.email "qwencoder-bot@users.noreply.github.com"

          BRANCH="qwen/issue-${ISSUE_NUMBER}-${RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Qwen: изменения по задаче #${ISSUE_NUMBER}"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Qwen: изменения по задаче #${ISSUE_NUMBER}" \
            --body "Автоматический PR от Qwen Code (self-hosted VPS). Issue: #${ISSUE_NUMBER}. Trigger run: ${RUN_ID}.")

          echo "Создан PR: $PR_URL"
          gh issue comment "$ISSUE_NUMBER" --body "Готово, изменения в PR: $PR_URL"