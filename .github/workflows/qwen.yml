name: Qwen Code Action

on:
  issue_comment:
    types: [created]

jobs:
  qwen:
    if: contains(github.event.comment.body, '@qwencoder')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Qwen Code
        uses: QwenLM/qwen-code-action@v1
        with:
          qwen_api_key: ${{ secrets.QWEN_API_KEY }}
          model: auto
        env:
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_BASE_URL: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
          OPENAI_MODEL: auto