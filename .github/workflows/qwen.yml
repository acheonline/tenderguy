name: Qwen Code Action

on:
  issue_comment:
    types: [created]

jobs:
  qwen:
    if: contains(github.event.comment.body, '@qwencoder')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qwen Code
        run: npm install -g @qwen-code/qwen-code

      - name: Run Qwen Code
        env:
          MY_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_BASE_URL: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
          OPENAI_MODEL: auto
        run: |
          echo "Проверка: длина ключа из секрета = ${#MY_API_KEY} символов"
          
          # Извлекаем текст комментария, отрезая упоминание бота
          PROMPT=$(echo "${{ github.event.comment.body }}" | sed 's/@qwencoder//g')
          
          # Запускаем Qwen с явной передачей ключа
          qwen --yolo --prompt "$PROMPT" --output-format text --api-key "$MY_API_KEY"