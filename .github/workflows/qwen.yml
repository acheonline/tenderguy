name: Qwen Code Action

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  qwen:
    # Бот работает только для вас и только на вашем VPS
    if: contains(github.event.comment.body, '@qwencoder') && github.actor == 'acheonline'
    runs-on: [self-hosted, vps]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Run Qwen Code
        env:
          MY_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          PROMPT=$(echo "${{ github.event.comment.body }}" | sed 's/@qwencoder//g')
          qwen --approval-mode auto \
            --prompt "$PROMPT" \
            --output-format text \
            --auth-type openai \
            --openai-api-key "$MY_API_KEY" \
            --openai-base-url "https://token-plan.maas.qwencloudapi.com/compatible-mode/v1" \
            --model auto

      - name: Create Branch, Commit, and Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config --global user.name "Qwen Bot"
          git config --global user.email "qwen-bot@users.noreply.github.com"
          
          if [[ -z $(git status --porcelain) ]]; then
            echo "Нет изменений для коммита."
            exit 0
          fi
          
          BRANCH_NAME="qwen/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "feat: Qwen changes for issue #${ISSUE_NUMBER} [skip ci]"
          git push origin "$BRANCH_NAME"
          
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Qwen: Изменения по задаче #${ISSUE_NUMBER}" \
            --body "Автоматический PR от Qwen Code на Self-Hosted VPS."