name: Auto-Fix on Failure

# Срабатывает после завершения «Go CI»; если тот упал — Qwen на self-hosted
# runner читает логи, правит код и пушит исправление.
on:
  workflow_run:
    workflows: ["Go CI"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: write

# Один self-hosted runner: общая очередь с ботом @qwencoder
concurrency:
  group: qwen-vps
  cancel-in-progress: false

jobs:
  autofix:
    name: Qwen auto-fix
    # Защита от зацикливания: не чинить коммит, который сам является автофиксом.
    # Защита от форков: чинить только код из этого репозитория.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !contains(github.event.workflow_run.head_commit.message, '[auto-fix]')
    runs-on: [self-hosted, vps]

    env:
      PATH: /home/runner/.npm-global/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout failed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Пушить будем сами (PAT или GITHUB_TOKEN), чтобы не смешивать заголовки авторизации
          persist-credentials: false

      - name: Download failed run logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$FAILED_RUN_ID" --log-failed > "${RUNNER_TEMP}/failed.log" 2>&1 \
            || echo "(логи упавших шагов получить не удалось)" >> "${RUNNER_TEMP}/failed.log"
          wc -c "${RUNNER_TEMP}/failed.log"

      - name: Run Qwen Code (autofix)
        env:
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_BASE_URL: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          PROMPT_FILE="$(mktemp -p "${RUNNER_TEMP}" qwen-autofix.XXXXXX.md)"
          trap 'rm -f "$PROMPT_FILE"' EXIT

          {
            printf 'Ты работаешь в клоне репозитория tenderguy (текущая директория), ветка %s.\n\n' "$HEAD_BRANCH"
            printf 'CI-прогон «Go CI» #%s упал: %s\n\n' "$FAILED_RUN_ID" "$FAILED_RUN_URL"
            printf 'Логи упавших шагов:\n```\n'
            tail -c 60000 "${RUNNER_TEMP}/failed.log"
            printf '\n```\n\n'
            printf 'Задача: найти причину падения и исправить код в рабочей директории.\n\n'
            printf 'Правила:\n'
            printf -- '- Изучи логи, найди виновные файлы и исправь их.\n'
            printf -- '- Проверь исправление локально: go build ./... && go vet ./... && go test ./... (если в проекте есть Go-код).\n'
            printf -- '- Соблюдай CONTRIBUTING.md и правила линтера из .golangci.yml.\n'
            printf -- '- НЕ выполняй git commit/push и не создавай PR — коммит сделает следующий шаг workflow.\n'
            printf -- '- Никогда не выводи и не записывай в файлы значения переменных окружения с ключами.\n'
            printf -- '- Если падание не исправляется правкой кода (сбой инфраструктуры, внешняя зависимость, flaky-тест), ничего не меняй и напиши в конце ответа «НЕ СМОГ ИСПРАВИТЬ» с кратким пояснением.\n'
          } > "$PROMPT_FILE"

          qwen --yolo \
            --auth-type openai \
            --model auto \
            --output-format text \
            --channel CI \
            --prompt "$(cat "$PROMPT_FILE")" 2>&1 | tee "${RUNNER_TEMP}/qwen-autofix.log"

          {
            echo '### Qwen autofix output'
            echo '```'
            tail -c 60000 "${RUNNER_TEMP}/qwen-autofix.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_PAT: ${{ secrets.AUTOFIX_PAT }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Qwen не внёс изменений — автопочинка не выполнена (см. summary run'а)."
            exit 0
          fi

          git config user.name "qwencoder-bot"
          git config user.email "qwencoder-bot@users.noreply.github.com"

          # Push от GITHUB_TOKEN не перезапускает другие workflow, поэтому при
          # наличии секрета AUTOFIX_PAT пушим через PAT — тогда Go CI перезапустится сам.
          if [[ -n "${AUTOFIX_PAT}" ]]; then
            TOKEN="${AUTOFIX_PAT}"
          else
            echo "::warning::Секрет AUTOFIX_PAT не задан — пушу через GITHUB_TOKEN: Go CI НЕ перезапустится автоматически, повторный прогон нужно запустить вручную (Re-run)."
            TOKEN="${GH_TOKEN}"
          fi

          COMMIT_MSG="fix: [auto-fix] исправление после падения Go CI run #${FAILED_RUN_ID}"

          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"

          if [[ "${HEAD_BRANCH}" == "main" ]]; then
            # В main бот не пушит: отдельная ветка + PR
            FIX_BRANCH="autofix/run-${FAILED_RUN_ID}"
            git checkout -B "${FIX_BRANCH}"
            git add -A
            git commit -m "${COMMIT_MSG}"
            git -c "http.extraHeader=${AUTH_HEADER}" push origin "HEAD:${FIX_BRANCH}"
            if [[ -n "${AUTOFIX_PAT}" ]]; then
              PR_URL=$(GH_TOKEN="${AUTOFIX_PAT}" gh pr create \
                --base main \
                --head "${FIX_BRANCH}" \
                --title "fix: [auto-fix] после падения Go CI run #${FAILED_RUN_ID}" \
                --body "Автоматическое исправление от Qwen Code. Упавший run: ${FAILED_RUN_URL:-}.")
              echo "Создан PR: ${PR_URL}"
            fi
          else
            git checkout -B "${HEAD_BRANCH}"
            git add -A
            git commit -m "${COMMIT_MSG}"
            git -c "http.extraHeader=${AUTH_HEADER}" push origin "HEAD:${HEAD_BRANCH}"
            echo "Исправление запушено в ${HEAD_BRANCH}."
          fi
